<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login | Club Manager</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- Login Section Start -->
<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="col-md-6 col-lg-5 bg-light shadow p-5 rounded">
    <h2 class="text-center text-primary mb-4">Welcome Back</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
    <p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
    <div id="login-message" class="mt-3 text-center"></div>
  </div>
</div>
<!-- Login Section End -->

<script src="js/scripts.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const messageEl = document.getElementById("login-message");

    try {
      const res = await fetch("http://localhost:3001/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("username", username);
        localStorage.setItem("password", password); // salvăm doar local

        const redirectPage = localStorage.getItem("redirectAfterLogin") || "index.html";
        localStorage.removeItem("redirectAfterLogin");

        setTimeout(() => {
          window.location.href = redirectPage;
        }, 100);
      } else {
        messageEl.innerHTML = `<div class="alert alert-danger">Login failed: ${data.message || 'Invalid credentials.'}</div>`;
      }

    } catch (err) {
      console.error(err);
      messageEl.innerHTML = `<div class="alert alert-danger">Server error. Try again later.</div>`;
    }
  });
</script>

</body>
</html>
