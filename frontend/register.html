<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Register - ClubConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Stylesheets -->
  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>

<body class="bg-light">
<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 px-lg-5 py-3">
  <a href="index.html" class="navbar-brand p-0">
    <h1 class="text-primary m-0"><i class="fas fa-users me-2"></i>ClubConnect</h1>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
    <span class="fa fa-bars"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarCollapse">
    <ul id="navbarLinks" class="navbar-nav ms-auto py-0">
      <!-- Links inserted dynamically -->
    </ul>
  </div>
</nav>
<!-- Navbar End -->

<!-- Register Form Start -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-sm border-0 rounded-lg">
        <div class="card-body p-5">
          <h2 class="text-center text-primary mb-4">Create Account</h2>
    <form id="registerForm">
            <div class="mb-4">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
            <div class="mb-4">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" required>
            </div>
            <div id="register-message"></div>
            <button type="submit" class="btn btn-primary w-100 py-3 mb-4">Register</button>
            <p class="text-center mb-0">Already have an account? <a href="login.html" class="text-primary">Login here</a></p>
    </form>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Register Form End -->

<!-- Footer Start -->
<footer class="container-fluid bg-dark text-white text-center py-4">
  <div class="container">
    <p class="mb-0">&copy; 2025 <strong>ClubConnect</strong>. All rights reserved.</p>
  </div>
</footer>
<!-- Footer End -->

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>
</body>
</html>
