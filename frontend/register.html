<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register | Club Manager</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- Register Section Start -->
<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="col-md-6 col-lg-5 bg-light shadow p-5 rounded">
    <h2 class="text-center text-primary mb-4">Create an Account</h2>
    <form id="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3">Already have an account? <a href="login.html">Log in</a></p>
    <div id="register-message" class="mt-3 text-center"></div>
  </div>
</div>
<!-- Register Section End -->

<script src="js/scripts.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const messageEl = document.getElementById("register-message");

    try {
      const res = await fetch(`http://localhost:3001/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const text = await res.text();

      if (res.ok) {
        messageEl.innerHTML = `<div class="alert alert-success">${text}</div>`;
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      } else {
        messageEl.innerHTML = `<div class="alert alert-danger">${text || 'Registration failed.'}</div>`;
      }

    } catch (err) {
      console.error(err);
      messageEl.innerHTML = `<div class="alert alert-danger">Server error. Try again later.</div>`;
    }
  });
</script>
</body>
</html>
