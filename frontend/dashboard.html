<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | ClubConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
  <a class="navbar-brand" href="index.html">
    <i class="fas fa-users text-primary me-2"></i>ClubConnect
  </a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
      </li>
    </ul>
  </div>
</nav>

<!-- Content -->
<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Welcome, <span id="username">User</span>!</h2>
    <a href="create-club.html" class="btn btn-primary">
      <i class="fas fa-plus me-2"></i>Create New Club
    </a>
  </div>

  <div id="clubsContainer" class="row">
    <!-- Dynamic club cards go here -->
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    if (!token) {
      localStorage.setItem('redirectAfterLogin', 'dashboard.html');
      window.location.href = 'login.html';
      return;
    }

    fetch("http://localhost:3001/profile", {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(user => {
      document.getElementById('username').textContent = user.username;
    });

    fetch("http://localhost:3001/dashboard", {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(clubs => {
      const container = document.getElementById('clubsContainer');
      if (!clubs.length) {
        container.innerHTML = '<p>You are not a member of any clubs yet.</p>';
        return;
      }

      clubs.forEach(club => {
        const card = document.createElement('div');
        card.className = 'col-md-4 mb-4';
        card.innerHTML = `
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${club.name}</h5>
              <div class="mt-auto">
                <a href="club.html?id=${club.id}" class="btn btn-outline-primary btn-sm me-2">
                  <i class="fas fa-eye"></i> View
                </a>
                <a href="invite.html?clubId=${club.id}" class="btn btn-outline-warning btn-sm me-2">
                  <i class="fas fa-user-plus"></i> Invite
                </a>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });
  });
</script>
<script src="scripts.js"></script>
</body>
</html>
