<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Event</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h1>Create Event</h1>
  <form id="eventForm">
    <div class="mb-3">
      <label for="title" class="form-label">Event Title</label>
      <input type="text" class="form-control" id="title" required />
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Event Description</label>
      <textarea class="form-control" id="description" rows="4" required></textarea>
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" id="private" />
      <label class="form-check-label" for="private">Private Event</label>
    </div>

    <button type="submit" class="btn btn-primary">Create Event</button>
    <div id="message" class="mt-3"></div>
  </form>
</div>

<script>
  const form = document.getElementById('eventForm');
  const msg = document.getElementById('message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const params = new URLSearchParams(window.location.search);
    const clubId = params.get('club_id');

    const payload = {
      title: document.getElementById('title').value,
      description: document.getElementById('description').value,
      private: document.getElementById('private').checked
    };

    try {
      const token = localStorage.getItem('token');
      const response = await fetch("http://localhost:3001/clubs/${clubId}/events/create", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      const text = await response.text();
      if (response.ok) {
        msg.innerHTML = `<div class="alert alert-success">${text}</div>`;
        form.reset();
      } else {
        msg.innerHTML = `<div class="alert alert-danger">${text}</div>`;
      }
    } catch (err) {
      msg.innerHTML = `<div class="alert alert-danger">Error creating event.</div>`;
      console.error(err);
    }
  });
</script>
<script src="scripts.js"></script>
<div id="navbar-container"></div>
</body>
</html>
