<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Club</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h1>Create a Club</h1>
  <form id="clubForm">
    <div class="mb-3">
      <label for="clubName" class="form-label">Club Name</label>
      <input type="text" class="form-control" id="clubName" required />
    </div>

    <button type="submit" class="btn btn-primary">Create Club</button>
    <div id="message" class="mt-3"></div>
  </form>
</div>

<script>
  const form = document.getElementById('clubForm');
  const msg = document.getElementById('message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      name: document.getElementById('clubName').value
    };

    try {
      const token = localStorage.getItem('token');
      const response = await fetch("http://localhost:3001/clubs/create", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      const text = await response.text();
      if (response.ok) {
        msg.innerHTML = `<div class="alert alert-success">${text}</div>`;
        form.reset();
      } else {
        msg.innerHTML = `<div class="alert alert-danger">${text}</div>`;
      }
    } catch (err) {
      msg.innerHTML = `<div class="alert alert-danger">Error creating club.</div>`;
      console.error(err);
    }
  });
</script>
<script src="scripts.js"></script>
<div id="navbar-container"></div>
</body>
</html>
