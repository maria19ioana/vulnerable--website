<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Club Details - ClubConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Stylesheets -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <style>
    .spinner-border {
      width: 1rem;
      height: 1rem;
    }
    .club-badge {
      background-color: #f8f9fa;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      margin-right: 0.5rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .category-badge {
      background-color: #f1f8ff;
      border: 1px solid #e1e4e8;
      color: #0366d6;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .section-header {
      border-bottom: 2px solid #f1f1f1;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .membership-status {
      background-color: #f1f8ff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #e1e4e8;
    }
    .member-item {
      display: flex;
      align-items: center;
    }
    .member-item .member-name {
      flex-grow: 1;
    }
    .member-item .member-role {
      margin-left: 10px;
      font-size: 0.8rem;
      color: #6c757d;
    }
  </style>
</head>
<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 px-lg-5 py-3">
  <a href="index.html" class="navbar-brand p-0">
    <h1 class="text-primary m-0"><i class="fas fa-users me-2"></i>ClubConnect</h1>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
    <span class="fa fa-bars"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarCollapse">
    <ul id="navbarLinks" class="navbar-nav ms-auto py-0">
      <!-- Populated dynamically -->
    </ul>
  </div>
</nav>
<!-- Navbar End -->

<!-- Club Info -->
<div class="container py-5">
  <div class="row mb-4">
    <div class="col-12">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
          <li class="breadcrumb-item active" aria-current="page">Club Details</li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="text-center mb-5">
    <h1 id="club-name" class="display-4">
      <span class="spinner-border text-primary" role="status"></span> Loading Club...
    </h1>
    <p id="club-description" class="lead text-muted">Fetching club details...</p>
    <div id="club-category" class="mt-2">
      <!-- Category will be displayed here -->
    </div>
    <div id="club-actions" class="mt-3">
      <!-- Action buttons will be added here if user is owner -->
    </div>
  </div>

  <!-- Membership Status Section -->
  <div id="membership-section" class="membership-status mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h4 class="mb-0"><i class="fas fa-user-check me-2"></i>Membership Status</h4>
        <p id="membership-status-text" class="mb-0 mt-2">
          <span class="spinner-border text-primary" role="status"></span> Checking membership status...
        </p>
      </div>
      <div id="membership-actions">
        <button id="join-club-btn" class="btn btn-primary d-none">
          <i class="fas fa-user-plus"></i> Join Club
        </button>
        <button id="leave-club-btn" class="btn btn-outline-danger d-none">
          <i class="fas fa-sign-out-alt"></i> Leave Club
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Members Section -->
    <div class="col-md-4 mb-5">
      <div class="section-header">
        <h3><i class="fas fa-users me-2 text-primary"></i>Members</h3>
        <button id="invite-member-btn" class="btn btn-sm btn-outline-primary d-none">
          <i class="fas fa-user-plus"></i> Invite
        </button>
      </div>
      <ul id="member-list" class="list-group shadow-sm">
        <li class="list-group-item text-center">
          <span class="spinner-border text-primary" role="status"></span> Loading members...
        </li>
      </ul>
    </div>

    <!-- Events Section -->
    <div class="col-md-8">
      <div class="section-header">
        <h3><i class="fas fa-calendar-alt me-2 text-primary"></i>Events</h3>
        <button id="create-event-btn" class="btn btn-sm btn-primary d-none">
          <i class="fas fa-plus"></i> Create Event
        </button>
      </div>
      <div id="event-list" class="row g-4">
        <div class="col-12 text-center py-5">
          <span class="spinner-border text-primary" role="status"></span>
          <p class="mt-2">Loading events...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="container-fluid bg-dark text-white text-center py-4">
  <div class="container">
    <p class="mb-0">&copy; 2025 <strong>ClubConnect</strong>. All rights reserved.</p>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Update navigation
    if (typeof updateNavigation === 'function') {
      updateNavigation();
    } else if (typeof updateNavbarLinks === 'function') {
      updateNavbarLinks();
    }

    // Get the club ID from URL parameters
    const params = new URLSearchParams(window.location.search);
    const clubId = params.get('id');
    
    if (!clubId) {
      document.getElementById('club-name').textContent = 'Club Not Found';
      document.getElementById('club-description').innerHTML = '<div class="alert alert-danger">No club ID provided in the URL. Please go back and select a club.</div>';
      document.getElementById('membership-section').classList.add('d-none');
      return;
    }
    
    console.log(`Loading club with ID: ${clubId}`);
    
    // Call the loadClubDetails function
    loadClubDetails(clubId);
    
    // Check membership status
    loadMembershipStatus(clubId);
    
    // Setup create event button click handler
    const createEventBtn = document.getElementById('create-event-btn');
    if (createEventBtn) {
      createEventBtn.addEventListener('click', () => {
        window.location.href = `create-event.html?club=${clubId}`;
      });
    }
    
    // Setup invite member button click handler
    const inviteMemberBtn = document.getElementById('invite-member-btn');
    if (inviteMemberBtn) {
      inviteMemberBtn.addEventListener('click', () => {
        window.location.href = `invite.html?club=${clubId}`;
      });
    }
    
    // Setup join club button
    const joinClubBtn = document.getElementById('join-club-btn');
    if (joinClubBtn) {
      joinClubBtn.addEventListener('click', async () => {
        joinClubBtn.disabled = true;
        joinClubBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Joining...';
        
        try {
          await joinClub(clubId);
          // Membership status and member list are updated in the joinClub function
        } catch (error) {
          console.error('Error joining club:', error);
          alert('Failed to join the club: ' + (error.message || 'Please try again later.'));
        } finally {
          joinClubBtn.disabled = false;
          joinClubBtn.innerHTML = '<i class="fas fa-user-plus"></i> Join Club';
        }
      });
    }
    
    // Setup leave club button
    const leaveClubBtn = document.getElementById('leave-club-btn');
    if (leaveClubBtn) {
      leaveClubBtn.addEventListener('click', async () => {
        if (confirm('Are you sure you want to leave this club?')) {
          leaveClubBtn.disabled = true;
          leaveClubBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Leaving...';
          
          try {
            await leaveClub(clubId);
            // Membership status and member list are updated in the leaveClub function
          } catch (error) {
            console.error('Error leaving club:', error);
            alert('Failed to leave the club: ' + (error.message || 'Please try again later.'));
          } finally {
            leaveClubBtn.disabled = false;
            leaveClubBtn.innerHTML = '<i class="fas fa-sign-out-alt"></i> Leave Club';
          }
        }
      });
    }

    // Watch for club action buttons to be added dynamically
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === 'childList') {
          setupClubActionButtons(clubId);
        }
      });
    });

    // Start observing the club-actions div for changes
    observer.observe(document.getElementById('club-actions'), { childList: true });
  });

  // Setup event listeners for Edit and Delete Club buttons
  function setupClubActionButtons(clubId) {
    // Edit Club button
    const editClubBtn = document.querySelector('#club-actions button.btn-outline-primary');
    if (editClubBtn) {
      editClubBtn.addEventListener('click', () => {
        showEditClubModal(clubId);
      });
    }

    // Delete Club button
    const deleteClubBtn = document.querySelector('#club-actions button.btn-outline-danger');
    if (deleteClubBtn) {
      deleteClubBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to delete this club? This action cannot be undone.')) {
          deleteClub(clubId);
        }
      });
    }
  }

  // Function to show edit club modal
  function showEditClubModal(clubId) {
    // Get current club data
    const clubName = document.getElementById('club-name').textContent;
    const clubDescription = document.getElementById('club-description').textContent;
    const categoryElement = document.querySelector('#club-category .category-badge');
    const category = categoryElement ? categoryElement.textContent.trim().replace(/.*?(\w+.*)$/, '$1') : '';

    // Create modal HTML
    const modalHtml = `
      <div class="modal fade" id="editClubModal" tabindex="-1" aria-labelledby="editClubModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="editClubModalLabel">Edit Club</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="editClubForm">
                <div class="mb-3">
                  <label for="editClubName" class="form-label">Club Name</label>
                  <input type="text" class="form-control" id="editClubName" value="${clubName}" required>
                </div>
                <div class="mb-3">
                  <label for="editClubCategory" class="form-label">Category</label>
                  <input type="text" class="form-control" id="editClubCategory" value="${category}">
                </div>
                <div class="mb-3">
                  <label for="editClubDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="editClubDescription" rows="3">${clubDescription}</textarea>
                </div>
                <div id="editClubMessage"></div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-primary" id="saveClubChanges">Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    `;

    // Append modal to body
    document.body.insertAdjacentHTML('beforeend', modalHtml);

    // Create Bootstrap modal instance
    const modal = new bootstrap.Modal(document.getElementById('editClubModal'));
    modal.show();

    // Setup save button
    document.getElementById('saveClubChanges').addEventListener('click', async () => {
      const name = document.getElementById('editClubName').value.trim();
      const description = document.getElementById('editClubDescription').value.trim();
      const category = document.getElementById('editClubCategory').value.trim();
      const messageDiv = document.getElementById('editClubMessage');

      if (!name) {
        messageDiv.innerHTML = '<div class="alert alert-danger">Club name is required</div>';
        return;
      }

      // Disable save button and show loading state
      const saveBtn = document.getElementById('saveClubChanges');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

      try {
        // Use POST instead of PUT since our server seems to have issues with PUT
        await apiPost(`/clubs/${clubId}/update`, { name, description, category }, true);
        
        // Close modal
        modal.hide();
        
        // Reload club details
        loadClubDetails(clubId);
      } catch (error) {
        console.error('Error updating club:', error);
        messageDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message || 'Something went wrong'}</div>`;
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save Changes';
      }
    });

    // Handle modal close and cleanup
    const modalElement = document.getElementById('editClubModal');
    modalElement.addEventListener('hidden.bs.modal', function () {
      // Check if the element still exists before trying to remove it
      const modalToRemove = document.getElementById('editClubModal');
      if (modalToRemove) {
        modalToRemove.remove();
      }
    });
  }

  // Function to delete a club
  async function deleteClub(clubId) {
    try {
      // Show loading state in delete button
      const deleteBtn = document.querySelector('#club-actions button.btn-outline-danger');
      if (deleteBtn) {
        deleteBtn.disabled = true;
        deleteBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Deleting...';
      }

      // Use POST instead of DELETE since our server seems to have issues with DELETE
      await apiPost(`/clubs/${clubId}/delete`, {}, true);
      
      alert('Club deleted successfully');
      window.location.href = 'dashboard.html'; // Redirect to dashboard
    } catch (error) {
      console.error('Error deleting club:', error);
      alert(`Error deleting club: ${error.message || 'Something went wrong'}`);
      const deleteBtn = document.querySelector('#club-actions button.btn-outline-danger');
      if (deleteBtn) {
        deleteBtn.disabled = false;
        deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i> Delete Club';
      }
    }
  }
</script>

</body>
</html>
