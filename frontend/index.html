  <!-- Stylesheets -->
  <link href="css/bootstrap.min.css" rel="stylesheet" />

<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 px-lg-5 py-3">
  <a href="index.html" class="navbar-brand p-0">
    <h1 class="text-primary m-0"><i class="fas fa-users me-2"></i>ClubConnect</h1>

<!-- Hero Section Start -->
<div class="container-fluid bg-primary text-white text-center py-5 mb-5">
  <div class="container py-5">
    <h4 class="text-uppercase fw-bold mb-3">Student Clubs Portal</h4>
    <h1 class="display-3 fw-bold mb-4">Join, Manage & Explore Clubs</h1>
    <p class="lead mb-4">A centralized platform to create events, manage club members, and connect across campus.</p>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const messageEl = document.getElementById("login-message");

    try {
      const res = await fetch("http://localhost:3001/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("password", password); // pentru edit privileges
        setTimeout(() => {
          window.location.href = "index.html";
        }, 100);
      } else {
        messageEl.innerHTML = `<div class="alert alert-danger">Login failed: ${data.message || 'Invalid credentials.'}</div>`;
      }

    } catch (err) {
      console.error(err);
      messageEl.innerHTML = `<div class="alert alert-danger">Server error. Try again later.</div>;
    }
  });
</script>
</body>
</html>
