<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Calendar Base -->
    <rect x="20" y="20" width="60" height="60" rx="5" fill="#FF1493"/>
    <rect x="20" y="30" width="60" height="50" rx="5" fill="white"/>
    
    <!-- Calendar Header -->
    <rect x="20" y="20" width="60" height="15" rx="5" fill="#FF1493"/>
    
    <!-- Calendar Days -->
    <circle cx="35" cy="45" r="3" fill="#FF1493"/>
    <circle cx="50" cy="45" r="3" fill="#FF1493"/>
    <circle cx="65" cy="45" r="3" fill="#FF1493"/>
    <circle cx="35" cy="60" r="3" fill="#FF1493"/>
    <circle cx="50" cy="60" r="3" fill="#FF1493"/>
    <circle cx="65" cy="60" r="3" fill="#FF1493"/>
    
    <!-- Plus Sign -->
    <rect x="45" y="70" width="10" height="2" fill="#FF1493"/>
    <rect x="49" y="66" width="2" height="10" fill="#FF1493"/>
</svg> 