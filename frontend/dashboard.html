<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard - ClubConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Stylesheets -->
  <link href="css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>

<body class="bg-light">
<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 px-lg-5 py-3">
  <a href="index.html" class="navbar-brand p-0">
    <h1 class="text-primary m-0"><i class="fas fa-users me-2"></i>ClubConnect</h1>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
    <span class="fa fa-bars"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarCollapse">
    <ul id="navbarLinks" class="navbar-nav ms-auto py-0">
      <!-- Links inserted dynamically -->
    </ul>
  </div>
</nav>
<!-- Navbar End -->

<!-- Dashboard Content Start -->
<div class="container py-5">
  <div class="row">
    <!-- Sidebar Start -->
    <div class="col-lg-3">
      <div class="card shadow-sm border-0 rounded-lg mb-4">
        <div class="card-body">
          <div class="d-flex align-items-center mb-4">
            <div class="btn-square bg-primary rounded-circle me-3">
              <i class="fas fa-user text-white"></i>
            </div>
            <h5 class="mb-0" id="username-display">Username</h5>
          </div>
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link active text-primary" href="dashboard.html">
                <i class="fas fa-home me-2"></i>Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">
                <i class="fas fa-user me-2"></i>Profile
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="create-club.html">
                <i class="fas fa-plus me-2"></i>Create Club
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="create-event.html">
                <i class="fas fa-calendar-plus me-2"></i>Create Event
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="logoutBtn">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <!-- Sidebar End -->

    <!-- Main Content Start -->
    <div class="col-lg-9">
      <!-- Welcome Section -->
      <div class="card shadow-sm border-0 rounded-lg mb-4">
        <div class="card-body p-4">
          <h4 class="text-primary mb-3">Welcome to Your Dashboard</h4>
          <p class="mb-0">Manage your clubs, events, and connections all in one place.</p>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="card shadow-sm border-0 rounded-lg">
            <div class="card-body p-4">
              <div class="d-flex align-items-center">
                <div class="btn-square bg-primary rounded-circle me-3">
                  <i class="fas fa-users text-white"></i>
                </div>
                <div>
                  <h6 class="mb-1">My Clubs</h6>
                  <h4 class="mb-0" id="clubs-count">0</h4>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm border-0 rounded-lg">
            <div class="card-body p-4">
              <div class="d-flex align-items-center">
                <div class="btn-square bg-primary rounded-circle me-3">
                  <i class="fas fa-calendar-alt text-white"></i>
                </div>
                <div>
                  <h6 class="mb-1">Upcoming Events</h6>
                  <h4 class="mb-0" id="events-count">0</h4>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm border-0 rounded-lg">
            <div class="card-body p-4">
              <div class="d-flex align-items-center">
                <div class="btn-square bg-primary rounded-circle me-3">
                  <i class="fas fa-bell text-white"></i>
                </div>
                <div>
                  <h6 class="mb-1">Notifications</h6>
                  <h4 class="mb-0" id="notifications-count">0</h4>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="card shadow-sm border-0 rounded-lg">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="text-primary mb-0">Recent Activity</h5>
            <button id="refresh-dashboard" class="btn btn-sm btn-outline-primary">
              <i class="fas fa-sync-alt me-1"></i> Refresh
            </button>
          </div>
          <div id="activity-list">
            <!-- Activity items will be inserted here -->
          </div>
        </div>
      </div>
    </div>
    <!-- Main Content End -->
  </div>
</div>
<!-- Dashboard Content End -->

<!-- Footer Start -->
<footer class="container-fluid bg-dark text-white text-center py-4">
  <div class="container">
    <p class="mb-0">&copy; 2025 <strong>ClubConnect</strong>. All rights reserved.</p>
  </div>
</footer>
<!-- Footer End -->

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>
</body>
</html>
