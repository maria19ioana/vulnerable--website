<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Club Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Stylesheets -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
</head>
<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 px-lg-5 py-3">
  <a href="index.html" class="navbar-brand p-0">
    <h1 class="text-primary m-0"><i class="fas fa-users me-2"></i>ClubConnect</h1>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
    <span class="fa fa-bars"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarCollapse">
    <ul id="navbarLinks" class="navbar-nav ms-auto py-0">
      <!-- Populated dynamically -->
    </ul>
  </div>
</nav>
<!-- Navbar End -->

<!-- Club Info -->
<div class="container py-5">
  <div class="text-center mb-5">
    <h1 id="club-name" class="display-4">Club Name</h1>
    <p id="club-description" class="lead text-muted">Club description goes here...</p>
    <div id="club-actions" class="mt-3">
      <!-- Only shown if user is club owner -->
    </div>
  </div>

  <!-- Members Section -->
  <div class="mb-5">
    <h3>Members</h3>
    <ul id="member-list" class="list-group"></ul>
  </div>

  <!-- Events Section -->
  <div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Events</h3>
      <button id="create-event-btn" class="btn btn-primary d-none">Create Event</button>
    </div>
    <div id="event-list" class="row g-4">
      <!-- Event cards will be inserted here -->
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="container-fluid bg-dark text-white text-center py-4">
  <div class="container">
    <p class="mb-0">&copy; 2025 <strong>ClubConnect</strong>. All rights reserved.</p>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="scripts.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    updateNavbarLinks(); // injectează linkuri dacă ești logat

    const params = new URLSearchParams(window.location.search);
    const clubId = params.get('id');
    if (!clubId) {
      alert("No club ID provided.");
      return;
    }
    loadClubDetails(clubId); // din scripts.js
  });
</script>

</body>
</html>
