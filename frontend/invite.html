<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Club Invite - ClubConnect</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
</head>
<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 px-lg-5 py-3">
  <a href="index.html" class="navbar-brand p-0">
    <h1 class="text-primary m-0"><i class="fas fa-users me-2"></i>ClubConnect</h1>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
    <span class="fa fa-bars"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarCollapse">
    <ul id="navbarLinks" class="navbar-nav ms-auto py-0">
      <!-- Populated dynamically -->
    </ul>
  </div>
</nav>
<!-- Navbar End -->

<div class="container py-5">
  <div class="row mb-4">
    <div class="col-12">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
          <li class="breadcrumb-item"><a id="club-link" href="#">Club</a></li>
          <li class="breadcrumb-item active" aria-current="page">Send Invite</li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="m-0"><i class="fas fa-envelope me-2"></i>Send Club Invite</h3>
        </div>
        <div class="card-body">
          <div id="club-info" class="alert alert-info mb-4">
            <span class="spinner-border spinner-border-sm" role="status"></span> Loading club information...
          </div>
          
          <form id="inviteForm">
            <input type="hidden" id="clubId" name="clubId">
            
            <div class="mb-3">
              <label for="email" class="form-label">Invitee Email</label>
              <input type="email" class="form-control" id="email" required placeholder="Enter email address" />
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Role (optional)</label>
              <select class="form-control" id="role">
                <option value="">Default (member)</option>
                <option value="admin">Admin</option>
                <option value="member">Member</option>
              </select>
            </div>

            <div class="d-flex justify-content-between">
              <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                <i class="fas fa-arrow-left me-2"></i>Back to Club
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-paper-plane me-2"></i>Send Invite
              </button>
            </div>
            <div id="message" class="mt-4"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="container-fluid bg-dark text-white text-center py-4 mt-5">
  <div class="container">
    <p class="mb-0">&copy; 2025 <strong>ClubConnect</strong>. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Update navigation
    if (typeof updateNavigation === 'function') {
      updateNavigation();
    } else if (typeof updateNavbarLinks === 'function') {
      updateNavbarLinks();
    }
    
    // Get club ID from URL parameters
    const params = new URLSearchParams(window.location.search);
    const clubId = params.get('club');
    
    if (!clubId) {
      document.getElementById('club-info').innerHTML = 
        '<div class="alert alert-danger">No club ID provided. Please go back and select a club.</div>';
      document.getElementById('inviteForm').style.display = 'none';
      return;
    }
    
    // Set club ID in the hidden input
    document.getElementById('clubId').value = clubId;
    
    // Update the back to club link
    document.getElementById('club-link').href = `club.html?id=${clubId}`;
    
    // Load club info
    loadClubInfo(clubId);
    
    // Handle form submission
    const form = document.getElementById('inviteForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Sending...';

      const email = document.getElementById('email').value;
      const role = document.getElementById('role').value;

      try {
        const response = await apiPost(`/clubs/${clubId}/invite`, { email, role }, true);
        
        if (response && response.inviteLink) {
          msg.innerHTML = `<div class="alert alert-success">
            <i class="fas fa-check-circle me-2"></i>Invite sent successfully!
            <br><strong>Link:</strong> <a href="${response.inviteLink}" target="_blank">${response.inviteLink}</a>
          </div>`;
          form.reset();
          document.getElementById('clubId').value = clubId; // Reset the hidden clubId
        } else {
          msg.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>${response.message || 'Error sending invite.'}</div>`;
        }
      } catch (err) {
        console.error('Error sending invite:', err);
        msg.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>${err.message || 'Network error occurred.'}</div>`;
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Invite';
      }
    });
  });
  
  // Function to load club info
  async function loadClubInfo(clubId) {
    const clubInfoElement = document.getElementById('club-info');
    
    try {
      const club = await apiGet(`/clubs/${clubId}`, true);
      
      clubInfoElement.innerHTML = `
        <div class="d-flex align-items-center">
          <i class="fas fa-info-circle me-2 text-primary"></i>
          <div>
            <p class="mb-0">You are sending an invite to join:</p>
            <h5 class="mb-0 text-primary">${club.name}</h5>
          </div>
        </div>
      `;
    } catch (error) {
      console.error('Error loading club info:', error);
      clubInfoElement.innerHTML = `
        <div class="alert alert-warning">
          <i class="fas fa-exclamation-triangle me-2"></i>
          Could not load club details, but you can still send the invite.
        </div>
      `;
    }
  }
</script>
</body>
</html>
